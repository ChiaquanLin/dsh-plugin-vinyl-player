<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vinyl room">
  <defs>
    <linearGradient id="deckFill" x1="8" y1="18" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFC53D"/>
    </linearGradient>
  </defs>

  <!-- cartoon deck: flat fill, bold outline, chunky drop shadow -->
  <rect x="4" y="16" width="56" height="40" rx="9" fill="url(#deckFill)" stroke="#2b2118" stroke-width="3"/>
  <path d="M4 45h56v2a9 9 0 0 1-9 9H13a9 9 0 0 1-9-9Z" fill="#F5B93E" stroke="#2b2118" stroke-width="3"/>
  <path d="M4 45h56" stroke="#2b2118" stroke-width="3"/>

  <!-- platter + the round black record -->
  <circle cx="25" cy="36" r="16" fill="#4a3f33" stroke="#2b2118" stroke-width="3"/>
  <circle cx="25" cy="36" r="14" fill="#221f2b" stroke="#14121a" stroke-width="3"/>
  <circle cx="25" cy="36" r="9.4" fill="none" stroke="#3b3750" stroke-width="1.6"/>
  <circle cx="25" cy="36" r="6.4" fill="none" stroke="#3b3750" stroke-width="1.6"/>
  <circle cx="25" cy="36" r="4.6" fill="#EF476F" stroke="#14121a" stroke-width="2"/>
  <circle cx="25" cy="36" r="1.2" fill="#f3efe6"/>

  <!-- tonearm: the transport, angled onto the record -->
  <g transform="rotate(24 49 24)">
    <rect x="46.6" y="24" width="4.8" height="22" rx="2.4" fill="#fdfaf3" stroke="#14121a" stroke-width="2.4"/>
    <rect x="44" y="42" width="10" height="6" rx="2" fill="#06D6A0" stroke="#14121a" stroke-width="2.4"/>
  </g>
  <circle cx="49" cy="24" r="5" fill="#7A5CC4" stroke="#14121a" stroke-width="2.6"/>
  <circle cx="49" cy="24" r="1.7" fill="#2b2118"/>

  <!-- speed switch -->
  <rect x="9" y="49" width="15" height="6.5" rx="3" fill="#e0a92f" stroke="#2b2118" stroke-width="2"/>
  <rect x="10.4" y="50.4" width="5.6" height="3.7" rx="1.6" fill="#2b2118"/>
</svg>
